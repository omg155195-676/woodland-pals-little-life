<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Woodland Pals: Little Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：手機直式單欄 — 標題 → 狀態列 → 森林畫面 → 八個功能按鈕。單一暖色主題（像一台橡實色的電子雞機身）。 */
:root{
  color-scheme: light;
  --bg:#EAF4DC;          /* 機身：嫩葉綠 */
  --panel:#FFFDF6;
  --ink:#4A3423;         /* 文字：深橡實棕 */
  --muted:#8A7560;
  --hair:#D9E6C4;
  --main:#C98A3E;        /* 橡實金棕 */
  --main-soft:#F6E7CF;
  --leaf:#7BB661;
  --low:#D5544E;
  --font:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --r:16px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-tap-highlight-color:transparent}
.app{max-width:470px;margin:0 auto;padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:20px;font-weight:400;letter-spacing:.02em}
.brand h1 small{color:var(--muted);font-size:13px;margin-left:4px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--hair);background:var(--panel);color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font:inherit;font-size:13px;cursor:pointer}
.icon-btn:focus-visible,.act:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:3px solid var(--main);outline-offset:2px}

.status{background:var(--panel);border-radius:var(--r);padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.status .who{font-size:15px}
.status .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--main-soft);white-space:nowrap;justify-self:end}
.status .chip.warn{background:var(--low);color:#fff}
.hearts{display:flex;gap:14px;grid-column:1/-1;font-size:12px;color:var(--muted)}
.hearts span{display:flex;align-items:center;gap:4px}
.hearts b{font-weight:400;letter-spacing:1px;font-size:14px;display:inline-block;color:#E0603A}
.hearts span:last-child b{color:#E07A92}
.hearts b.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.45)}60%{transform:scale(.92)}100%{transform:scale(1)}}

.stage-wrap{position:relative;border-radius:22px;overflow:hidden;background:#CFE8F5;box-shadow:0 0 0 2px var(--hair),0 8px 22px -12px rgba(70,90,40,.45)}
@media (max-width:520px){.stage-wrap{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));border-radius:0;box-shadow:none}}
#stage{display:block;width:100%;height:auto;aspect-ratio:480/320;max-width:100%;touch-action:manipulation;cursor:pointer}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink);background:rgba(255,253,246,.85);padding:3px 9px;border-radius:999px;pointer-events:none}

.actions{background:var(--panel);border-radius:var(--r);padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.act{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;transition:transform .08s, background .15s;position:relative}
.act:active{transform:scale(.96)}
.act .ic{font-size:24px;line-height:1}
.act .lb{font-size:12.5px;white-space:nowrap}
.act .sub{font-size:10px;color:var(--muted);white-space:nowrap}
.act[disabled]{opacity:.45;cursor:default}
.act.alert::after{content:'';position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--low)}

.sheet{position:fixed;inset:0;background:rgba(74,52,35,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-body{background:var(--panel);width:100%;max-width:470px;border-radius:22px 22px 0 0;padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:82vh;overflow:auto}
.sheet h2{margin:0;font-size:17px;font-weight:400}
.sheet p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:999px;align-self:flex-start}
.tab{border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(70,90,40,.2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.opt .ic{font-size:26px}
.opt .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .t small{color:var(--muted);font-size:11px}
.opt[aria-pressed=true]{border-color:var(--main);background:var(--main-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .opt{flex:1;justify-content:center;text-align:center;min-width:60px}
.close{align-self:stretch;font:inherit;border:0;background:var(--ink);color:var(--panel);border-radius:14px;padding:11px;cursor:pointer}
.danger{font:inherit;border:1px solid var(--low);background:transparent;color:var(--low);border-radius:14px;padding:10px;cursor:pointer}
.plain{font:inherit;border:1px solid var(--hair);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.statrow{display:grid;grid-template-columns:5em 1fr;gap:6px 10px;font-size:14px}
.statrow .k{color:var(--muted)}
.meter{height:10px;border-radius:6px;background:var(--hair);overflow:hidden;align-self:center}
.meter b{display:block;height:100%;background:var(--leaf)}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dex div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;min-height:70px;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center}
.dex .ic{font-size:24px}
.dex .no{color:var(--muted)}
.diary{background:var(--main-soft);border-radius:12px;padding:10px;font-size:13px;line-height:1.6}
textarea{width:100%;min-height:80px;font:12px monospace;border:1px solid var(--hair);border-radius:10px;padding:8px}
@media (prefers-reduced-motion: reduce){.act{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Woodland Pals<small>Little Life</small></h1>
      <p id="clock">　</p>
    </div>
    <button class="icon-btn" id="btnSettings" type="button">設定</button>
  </header>

  <section class="status" aria-label="寵物狀態" id="status">
    <span class="who" id="who"></span><span></span><span class="chip" id="chip"></span>
    <div class="hearts"><span>飽足 <b id="hHunger"></b></span><span>心情 <b id="hMood"></b></span></div>
  </section>

  <div class="stage-wrap">
    <canvas id="stage" width="480" height="320" aria-label="森林畫面。點寵物可以摸摸。"></canvas>
    <div class="hint" id="hint">點寵物可以摸摸</div>
  </div>

  <section class="actions" id="actions" aria-label="照顧按鈕"></section>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="growth.js"></script>
<script>
'use strict';
/* =====================================================================
   WOODLAND PALS: Little Life — 遊戲本體
   以 mare-freya-pet 框架為基礎（畫布、Pet 行為佇列、程式動畫、底部選單、存檔補算、小遊戲）。
   規則計算都在 growth.js；這裡只放時間推進、照顧循環、畫面與操作。
   規格：docs/*.md
   ===================================================================== */
const Gr = window.Growth;
const { MIN, HOUR, DAY, T, FOODS, FOOD, FORMS, FORM_ORDER } = Gr;
const W = 480, H = 320, TAU = Math.PI * 2;
const { sin, cos, abs, min, max, PI, floor, random, hypot, round } = Math;
const clamp = (v, a = 0, b = 100) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + random() * (b - a);
const pick = a => a[floor(random() * a.length)];
const FONT = '"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';

/* ---------- 角色配色（README_品牌資產與角色設定） ---------- */
const CHAR_COLOR = {
  kuri:  { body:'#FFF6E8', line:'#6B4A2E', accent:'#7BB661', name:'KURI' },
  sunny: { body:'#F39A3D', line:'#7A4A1E', accent:'#F7D23E', name:'SUNNY' },
  dodo:  { body:'#B5824F', line:'#5A3A1E', accent:'#E0603A', name:'DODO' },
  piko:  { body:'#D9B48A', line:'#5A3E22', accent:'#E8B53A', name:'PIKO' },
};
const CAT_TINT = { G:'#6FB34F', S:'#F3A13A', H:'#B5824F', C:'#B07ACF' };

/* ---------- 台詞 ---------- */
const LINES = {
  greet: ['你回來了！', '嗨～今天也一起玩！'], miss: ['好想你喔！', '你終於回來了～'],
  hungry: ['肚子餓了…', '想吃東西～'], fed: ['好好吃！', '嗯嗯～謝謝！', '吃飽飽！'], fav: ['這個最好吃了！', '是我最愛的！'],
  full: ['吃不下了啦～', '肚子好撐…'], refuse: ['哼～不要！', '不想吃～'], treat: ['甜甜的！', '點心萬歲！'],
  pat: ['嘿嘿～', '好舒服～', '再摸一下！'], sleepy: ['好睏喔…'], night: ['晚安～', '做個好夢…'], wake: ['早安！', '睡飽了～'],
  sick: ['不舒服…', '哈啾！'], cured: ['好了！謝謝你！'], notSick: ['我沒有生病喔！'], medicine: ['苦苦的…'],
  scolded: ['知道了～', '對不起…'], notNeeded: ['咦？我做錯什麼了嗎？'], fake: ['陪我嘛～', '看我看我！'],
  dirty: ['有便便…'], cleaned: ['乾淨了！'], noPlay: ['現在不想玩…'], sleepTalk: ['Zzz…', '嗯…好吃…'],
};
const line = k => pick(LINES[k] || ['…']);

/* ---------- 畫布 ---------- */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
function resize(){
  const dpr = min(3, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); window.addEventListener('resize', resize);
function ell(x, y, rx, ry, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function fs(fill, stroke, lw){ if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2.6; ctx.stroke(); } }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function emoji(ch, x, y, size){ ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); }
function txt(s, x, y, size, col, bold = true){
  ctx.font = `${bold ? '700 ' : ''}${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

/* =====================================================================
   遊戲狀態（存檔內容）
   ===================================================================== */
const LS_KEY = 'woodland-pals-life-v1';
const SAVE_VERSION = 1;
let G = null;         // 存檔
let speed = 1;        // 時間流速（開發測試用）
const newId = () => Date.now().toString(36) + floor(random() * 1e9).toString(36);
function newGame(collection){
  const t = Date.now();
  return {
    version: SAVE_VERSION, petId: newId(), gen: (G && G.gen || 0) + 1,
    t,                                  // 遊戲時鐘（毫秒）
    form: 'egg', stageMin: 0, bornAt: t, hatchAt: null,
    hunger: 80, mood: 75, discipline: 0,
    sick: false, sickSince: null, sickMistakeAt: null, medicineTries: 0,
    sleeping: false, napping: false, sleptAt: null,
    poops: [], poopDue: null,
    hidden: { G:0, S:0, H:0, C:0 }, babyMeals: 0,
    R: Gr.emptyRecords(),               // 幼年期紀錄（第二階段判定用）
    feedLog: [],                        // 最近 3 小時的餵食（重複倍率、點心肚子痛）
    zeroHungerSince: null, zeroMoodSince: null, hungerMistake: false, moodMistake: false,
    fake: null, fakeToday: 0,
    day: null, dayStats: null, diary: [],
    collection: collection || [],
    decisions: [],
    graceUntil: 0, patLog: [],
  };
}
const stageOf = form => FORMS[form].stage;
const charOf = form => FORMS[form].char || null;
const isPet = () => !['egg'].includes(stageOf(G.form));
const dateKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const hourOf = t => { const d = new Date(t); return d.getHours() + d.getMinutes() / 60; };
const petName = () => FORMS[G.form].stage === 'adult' ? CHAR_COLOR[charOf(G.form)].name : FORMS[G.form].name;

/* =====================================================================
   時間推進：每「遊戲分鐘」呼叫一次 tickMinute(online)
   online=false 是離線補算：不產生照顧失誤、不假撒嬌、便便最多 2 坨、數值最低半顆心
   ===================================================================== */
function tickMinute(online){
  G.t += MIN;
  const st = stageOf(G.form), h = hourOf(G.t);
  if (st === 'egg'){
    G.stageMin++;
    if (G.stageMin >= T.eggMin) hatch();
    return;
  }
  newDayCheck();
  // ---- 作息 ----
  if (G.sleeping){
    if (G.napping && (h >= T.napEnd || h < T.napStart)) { G.sleeping = G.napping = false; if (online) pet.say(line('wake'), 1800); }
    else if (!G.napping && h >= T.wakeHour && h < T.bedOpenHour) wakeUp(online);
  } else {
    if (h >= T.autoSleepHour || h < T.wakeHour) goSleep(false, online);
    else if (st === 'baby' && h >= T.napStart && h < T.napEnd && !G.sick) { G.sleeping = G.napping = true; }
  }
  // ---- 成長計時（生病暫停；睡覺照算）----
  if (!G.sick) G.stageMin++;
  growthCheck(online);
  if (G.sleeping) return;

  // ---- 數值下降 ----
  const d = Gr.DECAY[st];
  let moodMul = 1 + .2 * G.poops.length; if (G.sick) moodMul *= 1.5;
  G.hunger = clamp(G.hunger - d.hunger / 60);
  G.mood = clamp(G.mood - d.mood / 60 * moodMul);
  if (!online){ G.hunger = max(G.hunger, 12.5); G.mood = max(G.mood, 12.5); }

  // ---- 便便 ----
  if (G.poopDue && G.t >= G.poopDue){
    G.poopDue = null;
    if (G.poops.length < (online ? 3 : 2)){
      G.poops.push({ born: G.t, cleanBy: G.t + 30 * MIN, x: rnd(70, 410), y: rnd(250, 296), off: !online });
      if (st === 'child') G.R.poops++;
    }
  }
  if (online && !G.sick && G.t > G.graceUntil && G.poops.some(p => G.t - p.born > 2 * HOUR)) getSick('poop');

  // ---- 照顧失誤（只在開著遊戲時）----
  if (online){
    if (G.hunger <= 0){ G.zeroHungerSince ??= G.t; if (!G.hungerMistake && G.t - G.zeroHungerSince >= 15 * MIN){ G.hungerMistake = true; mistake('餓過頭'); } }
    else { G.zeroHungerSince = null; G.hungerMistake = false; }
    if (G.mood <= 0){ G.zeroMoodSince ??= G.t; if (!G.moodMistake && G.t - G.zeroMoodSince >= 15 * MIN){ G.moodMistake = true; mistake('不開心過頭'); } }
    else { G.zeroMoodSince = null; G.moodMistake = false; }
    if (G.sick && G.t - (G.sickMistakeAt || G.sickSince) >= HOUR){ G.sickMistakeAt = G.t; mistake('生病沒治'); }
    // 假撒嬌：一天 2～4 次
    if (G.fake && G.t > G.fake.until) G.fake = null;
    if (!G.fake && !G.sick && G.fakeToday < 4 && G.hunger >= 50 && G.mood >= 50 && random() < 3 / 720){
      G.fake = { until: G.t + 15 * MIN }; G.fakeToday++; pet.run([{ anim:'pout', dur:2600, say: line('fake') }]);
    }
    // 心情紀錄（幼年期，醒著、開著遊戲）
    if (st === 'child'){ G.R.moodSum += G.mood; G.R.moodN++; }
  }
}
function mistake(why){
  if (stageOf(G.form) === 'child') G.R.mistakes++;
  G.decisions.push({ t: G.t, type: 'mistake', why });
}
function getSick(why){
  G.sick = true; G.sickSince = G.t; G.sickMistakeAt = null; G.medicineTries = 0;
  G.sleeping = G.napping = false;
  pet.run([{ anim:'sick', dur:2400, say: why === 'treat' ? '肚子痛痛…' : line('sick') }]);
}
function goSleep(byPlayer, online){
  G.sleeping = true; G.napping = false; G.sleptAt = G.t; G.fake = null;
  if (online !== false){ pet.queue = []; pet.cur = null; pet.target = null; pet.say(line('night'), 2200); }
}
function wakeUp(online){
  const early = G.sleptAt && hourOf(G.sleptAt) >= T.bedOpenHour && hourOf(G.sleptAt) < T.autoSleepHour;
  G.sleeping = G.napping = false; G.sleptAt = null;
  if (early) G.mood = clamp(G.mood + 12.5);
  if (online) pet.say(line('wake'), 2000);
}
function newDayCheck(){
  const k = dateKey(G.t);
  if (G.day === k) return;
  if (G.day && G.dayStats) writeDiary();
  G.day = k; G.fakeToday = 0;
  G.dayStats = { meals:0, treats:0, plays:0, pats:0, cleans:0, cats:{ G:0, S:0, H:0, C:0 } };
}
function writeDiary(){
  const s = G.dayStats, n = petName();
  let text;
  if (stageOf(G.form) === 'baby'){
    const c = Gr.CATS.reduce((a, k) => s.cats[k] > s.cats[a] ? k : a, 'G');
    text = s.cats[c] ? `昨天${n}最常吃${Gr.CAT_LABEL[c]}的食物，頭上的嫩芽好像動了一下。` : `昨天${n}一直在等你餵它。`;
  } else {
    const opts = [[s.plays * 3, `昨天${n}一直想出去跑跳！`], [s.cleans * 2 + s.pats, `昨天${n}乖乖的，身邊整理得很乾淨。`], [s.treats * 3 + s.meals, `昨天${n}吃了好多好吃的東西！`]];
    opts.sort((a, b) => b[0] - a[0]);
    text = opts[0][0] ? opts[0][1] : `昨天${n}有點寂寞，好想你陪它。`;
  }
  G.diary.unshift({ day: G.day, text }); G.diary.length = min(G.diary.length, 14);
}

/* ---------- 成長 ---------- */
function hatch(){
  G.form = 'baby'; G.stageMin = 0; G.hatchAt = G.t; G.hunger = 60; G.mood = 70;
  collect('egg'); collect('baby');
  celebrate('孵出來了！是森林寶寶！');
}
function growthCheck(online){
  const st = stageOf(G.form);
  if (st === 'baby'){
    const ready = G.stageMin >= T.babyMin && (G.babyMeals >= T.babyMinMeals || G.stageMin >= T.babyMin + T.babyExtraMax);
    if (ready){
      const res = Gr.phase1(G.hidden, G.petId);
      G.decisions.push({ t: G.t, type: 'phase1', ...res });
      G.form = res.form; G.stageMin = 0; G.R = Gr.emptyRecords();
      collect(G.form); celebrate(`長大了！變成 ${CHAR_COLOR[res.form].name} 了！`);
    }
  } else if (st === 'child'){
    if (G.stageMin >= T.childMin && !G.sick){
      const res = Gr.phase2(charOf(G.form), G.R, G.discipline, G.petId);
      G.decisions.push({ t: G.t, type: 'phase2', form: res.form, style: res.style, scores: res.scores, metrics: res.metrics, hidden: res.hidden, roll: res.roll, mode: res.mode });
      G.form = res.form; G.stageMin = 0;
      collect(G.form); celebrate(FORMS[res.form].hidden ? `哇！變成了特別的「${FORMS[res.form].name}」！` : `成年了！變成「${FORMS[res.form].name}」！`);
    }

}
function collect(form){ if (!G.collection.includes(form)) G.collection.push(form); }
let flashAt = 0;
function celebrate(msg){ flashAt = performance.now(); toast(msg); pet.queue = []; pet.cur = null; pet.run([{ anim:'excited', dur:2600, say: msg }]); playChime(); }

/* =====================================================================
   寵物行為（框架的 Pet 類別，改成單一寵物）
   ===================================================================== */
const FLOOR = { x0:90, x1:390, y0:236, y1:286 };
let lastInput = performance.now();
let mg = null;
class Pet {
  constructor(){
    this.x = 240; this.y = 266; this.dir = 1;
    this.queue = []; this.cur = null; this.target = null;
    this.anim = 'idle'; this.animStart = performance.now();
    this.nextThink = performance.now() + rnd(3000, 6000);
    this.speech = null; this.prop = null;
  }
  setAnim(a){ if (this.anim !== a){ this.anim = a; this.animStart = performance.now(); } }
  say(text, dur = 3000){ this.speech = { text, until: performance.now() + dur }; }
  run(steps){ this.queue = steps.slice(); this.cur = null; this.target = null; }
  rest(){ if (stageOf(G.form) === 'egg') return 'egg'; return G.sleeping ? 'sleep' : G.sick ? 'sick' : G.fake ? 'pout' : 'idle'; }
  busy(){ return !!(this.cur || this.queue.length || this.target); }
  moveTo(x, y){ this.target = { x, y }; }
  update(dt, now){
    if (this.target){
      const dx = this.target.x - this.x, dy = this.target.y - this.y, d = hypot(dx, dy), sp = 52 * dt;
      if (abs(dx) > 1) this.dir = dx > 0 ? 1 : -1;
      if (d <= sp){ this.x = this.target.x; this.y = this.target.y; this.target = null; }
      else { this.x += dx / d * sp; this.y += dy / d * sp; this.setAnim('walk'); return; }
    }
    if (!this.cur && this.queue.length){ const c = this.cur = this.queue.shift(); if (c.to) this.moveTo(c.to.x, c.to.y); c.started = false; return; }
    if (this.cur){
      const c = this.cur;
      if (!c.started){
        c.started = true; c.t0 = now;
        if (c.prop !== undefined) this.prop = c.prop;
        if (c.start) c.start(this);
        if (c.say) this.say(typeof c.say === 'function' ? c.say(this) : c.say);
        this.setAnim(c.anim || this.rest());
      }
      if (now - c.t0 >= (c.dur || 0)){ if (c.end) c.end(this); this.cur = null; if (!this.queue.length) this.setAnim(this.rest()); }
      return;
    }
    if (this.anim !== this.rest()) this.setAnim(this.rest());
    think(this, now);
  }
}
const pet = new Pet();

// 自主行為：也是玩家觀察成長傾向的主要管道
function think(p, now){
  if (mg || now < p.nextThink) return;
  p.nextThink = now + rnd(4500, 9000);
  const st = stageOf(G.form);
  if (st === 'egg') return;
  if (G.sleeping){ if (random() < .15) p.say(line('sleepTalk'), 1800); return; }
  if (G.sick){ if (random() < .35) p.say(line('sick')); return; }
  if (G.fake) return;
  if (G.hunger < 25 && random() < .6){ p.run([{ anim:'sad', dur:2400, say: line('hungry') }]); return; }
  if (G.poops.length && random() < .4){ p.run([{ anim:'pout', dur:2200, say: line('dirty') }]); return; }
  const h = hourOf(G.t);
  if (h >= T.bedOpenHour && random() < .3){ p.run([{ anim:'tired', dur:2400, say: line('sleepy') }]); return; }
  // 傾向提示
  if (st === 'child'){
    const lead = Gr.childHint(G.R, G.discipline);
    if (lead && random() < .45){
      if (lead === 'P') p.run([{ to: { x: rnd(FLOOR.x0, FLOOR.x1), y: rnd(FLOOR.y0, FLOOR.y1) }, dur:0 }, { anim:'happy', dur:2000 }]);
      else if (lead === 'R') p.run([{ anim:'groom', dur:2600 }]);
      else p.run([{ anim:'sniff', dur:2600 }]);
      return;
    }
    const hc = Gr.hiddenCheck(charOf(G.form), G.R, G.discipline);
    if (hc.count >= 2 && random() < .25){ p.run([{ anim:'sparkle', dur:2000 }]); return; }
  }
  const r = random();
  if (r < .45) p.run([{ to: { x: rnd(FLOOR.x0, FLOOR.x1), y: rnd(FLOOR.y0, FLOOR.y1) }, dur:0 }]);
  else if (r < .6 && G.mood > 65) p.run([{ anim:'happy', dur:1800 }]);
  else if (r < .7) p.run([{ anim:'look', dur:2600 }]);
}

/* =====================================================================
   程式動畫（每個動作一張圖，動作感用程式做）
   ===================================================================== */
function animState(p, t){
  const s = { bob:0, sway:0, squash:0, face:'normal', fx:null, lie:false };
  switch (p.anim){
    case 'egg': { const c = t % 3; s.sway = c < .6 ? sin(c * 20) * .12 : 0; break; }
    case 'idle': s.bob = sin(t * 2.6) * 1.4; s.sway = sin(t * 1.3) * .03; break;
    case 'walk': s.bob = abs(sin(t * 10)) * 4; s.sway = sin(t * 10) * .05; break;
    case 'happy': { const c = t % 1.4; s.bob = c < 1 ? abs(sin(c / .5 * PI)) * 14 : 0; s.face = 'happy'; s.fx = 'note'; break; }
    case 'excited': { const c = t % 1.2; s.bob = c < 1 ? abs(sin(c / .5 * PI)) * 18 : 0; s.face = 'happy'; s.fx = 'sparkle'; break; }
    case 'sad': s.bob = -2; s.face = 'sad'; s.fx = 'gloom'; break;
    case 'pout': s.sway = sin(t * 2.2) * .06; s.face = 'refuse'; s.fx = 'call'; break;
    case 'tired': s.bob = -3 + sin(t * 1.2); s.face = 'sleepy'; s.fx = 'zz'; break;
    case 'sleep': s.lie = true; s.bob = sin(t * 1.6) * .8; s.face = 'sleepy'; s.fx = 'zzz'; break;
    case 'eat': { const c = t % .6; s.squash = c < .18 ? sin(c / .18 * PI) * .07 : 0; s.bob = c < .18 ? 0 : sin(t * 7) * 1.2; s.face = 'eat'; s.fx = t > .5 ? 'heart' : null; break; }
    case 'refuse': s.sway = sin(t * 14) * .08; s.face = 'refuse'; break;
    case 'headpat': s.squash = .05 + sin(t * 7) * .02; s.face = 'pat'; s.fx = 'heart'; break;
    case 'sick': s.sway = sin(t) * .04; s.face = 'sick'; s.fx = 'sneeze'; break;
    case 'medicine': s.squash = sin(t * 9) * .03; s.face = 'sad'; s.fx = 'sweat'; break;
    case 'scolded': s.bob = -3; s.face = 'sad'; s.fx = 'sweat'; break;
    case 'confused': s.sway = .12; s.face = 'surprised'; s.fx = 'question'; break;
    case 'groom': s.sway = sin(t * 2.5) * .05; s.face = 'happy'; s.fx = 'sparkle'; break;
    case 'sniff': s.bob = abs(sin(t * 6)) * 2; s.face = 'eat'; s.fx = 'smell'; break;
    case 'sparkle': s.bob = sin(t * 3) * 2; s.face = 'happy'; s.fx = 'sparkle'; break;
    case 'look': s.sway = sin(t * .9) * .1; s.face = 'normal'; break;
    case 'mg_run': s.bob = abs(sin(t * 12)) * 3; s.face = 'happy'; break;
    case 'surprised': s.bob = t < .35 ? sin(t / .35 * PI) * 14 : 0; s.face = 'surprised'; s.fx = 'bang'; break;
  }
  if (p.anim === 'idle' || p.anim === 'walk' || p.anim === 'look'){
    if (G.mood < 25) s.face = 'sad'; else if (G.mood > 70) s.face = 'happy';
  }
  return s;
}

function actFor(anim){
  if (anim === 'sleep') return 'sleep';
  if (anim === 'eat' || anim === 'sniff') return 'eat';
  if (anim === 'sick' || anim === 'medicine') return 'sick';
  if (anim === 'mg_run' || anim === 'happy' || anim === 'excited') return 'play';
  return 'idle';
}

function drawPet(p, now){
  const t = (now - p.animStart) / 1000, s = animState(p, t);
  p._s = s;
  const st = stageOf(G.form), f = G.form;
  const scale = st === 'adult' ? 1.18 : st === 'child' ? 1 : st === 'baby' ? .8 : .85;
  // 影子
  ell(p.x, p.y, 34 * scale * (1 - s.bob / 70), 6); ctx.fillStyle = 'rgba(60,80,30,.18)'; ctx.fill();
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(s.sway); ctx.translate(0, -s.bob);
  if (s.squash) ctx.scale(1 + s.squash, 1 - s.squash);
  const img = actImg(f, actFor(p.anim));
  let hgt = 0;
  if (img){
    hgt = img.height * 118 * scale / 384; const w = img.width * hgt / img.height;   // 所有動作圖用同一個比例（idle 高 384px）
    if (p.dir < 0 && st !== 'egg') ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, -hgt, w, hgt);
    if (st === 'egg') eggCrack(hgt, w);
    if (st === 'baby') babyOverlay(s, hgt, w, now);
    if (st === 'adult' && !IMG[`${f}_act_idle`]){ if (p.dir < 0) ctx.scale(-1, 1); adultBadge(FORMS[f], charOf(f), hgt, w, now); }
    else if (st === 'adult' && FORMS[f].hidden && !G.sleeping) hiddenSparkle(hgt, w, now);
  } else if (st === 'egg') hgt = drawEgg(now);
  else if (st === 'baby') hgt = drawBaby(s, now);
  else hgt = drawHead(charOf(f), s, scale, st === 'adult' ? FORMS[f] : null, now);
  ctx.restore();
  p._top = p.y - hgt - s.bob; p._h = hgt; p._w = img ? img.width * hgt / img.height : hgt;
  if (G.sleeping && st !== 'egg' && !mg && !actImg(f, 'sleep', true)) drawBlanket(p, scale);
}
// 森林寶寶正式圖的程式疊加：睡覺閉眼、嫩芽傾向提示（位置是相對圖片的比例）
const BABY_EYES = [[-.105, .388], [.209, .388]], BABY_LEAF = [.139, .90];
function babyOverlay(s, hgt, w, now){
  const hint = Gr.babyHint(G.hidden), t = now / 1000;
  if (hint.level === 2 || (hint.level === 1 && (t % 6) < 1.5)){
    const x = BABY_LEAF[0] * w, y = -BABY_LEAF[1] * hgt, r = hgt * .1;
    const g = ctx.createRadialGradient(x, y, r * .2, x, y, r);
    g.addColorStop(0, CAT_TINT[hint.cat] + 'CC'); g.addColorStop(1, CAT_TINT[hint.cat] + '00');
    ctx.fillStyle = g; ell(x, y, r, r); ctx.fill();
    if (hint.cat === 'S'){ ell(x + r * .7, y - r * .5, 3, 3); fs('#FFE27A'); }
  }
  if (G.sleeping || s.face === 'sleepy'){
    const er = hgt * .05;
    for (const [ex, ey] of BABY_EYES){
      const x = ex * w, y = -ey * hgt;
      ell(x, y, er * 1.15, er * 1.2); fs('#FFF3DC');
      ctx.beginPath(); ctx.arc(x, y - er * .2, er * .8, .25, PI - .25); ctx.strokeStyle = '#4A2A16'; ctx.lineWidth = max(2, hgt / 50); ctx.lineCap = 'round'; ctx.stroke();
    }
  }
}
// 快孵化時在蛋身畫裂痕（正式圖與暫代圖共用）
function eggCrack(hgt, w){
  if (T.eggMin - G.stageMin > 1) return;
  const y = -hgt * .36, s = w / 2.6;
  ctx.strokeStyle = '#4A2A16'; ctx.lineWidth = max(2, hgt / 45); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s, y); ctx.lineTo(-s * .55, y + s * .22); ctx.lineTo(-s * .15, y - s * .12); ctx.lineTo(s * .25, y + s * .2); ctx.lineTo(s * .6, y - s * .08); ctx.stroke();
}
// 找動作圖：型態自己的 → 成年型還沒有圖時借用幼年角色的圖 → 同型態的 idle
function actImg(f, act, exact){
  const ch = charOf(f), adult = stageOf(f) === 'adult';
  // 成年型只要有自己的 idle，就一律用自己的圖（缺的動作用 idle＋程式動畫），不混用幼年圖，配件才不會消失
  if (adult && IMG[`${f}_act_idle`]){
    if (IMG[`${f}_act_${act}`]) return IMG[`${f}_act_${act}`];
    // 成年型還沒有睡覺／生病圖：借用幼年角色的睡覺／生病圖（閉眼躺著），不要站著睡
    if ((act === 'sleep' || act === 'sick') && IMG[`${ch}_act_${act}`]) return IMG[`${ch}_act_${act}`];
    return exact ? null : IMG[`${f}_act_idle`];
  }
  return IMG[`${f}_act_${act}`] || (adult && IMG[`${ch}_act_${act}`]) || (exact ? null : IMG[`${f}_act_idle`] || (adult && IMG[`${ch}_act_idle`]));
}
// 成年型正式圖完成前：在幼年圖旁加上代表配件的徽章
function adultBadge(F, ch, hgt, w, now){

}
// 隱藏型的閃光（正式圖本身不畫閃光）

function drawBaby(s, now){

function drawHead(ch, s, scale, adultForm, now){

  const img = IMG[`${ch}_face_${key}`];
  const size = 104 * scale;
  if (img){ ctx.drawImage(img, -size / 2, -size, size, size); }
  else { ell(0, -size / 2, size / 2.2, size / 2.2); fs(CHAR_COLOR[ch].body, CHAR_COLOR[ch].line, 3); }
  if (adultForm){
    const t = now / 1000;

const GOOD = ['🍓', '🍎', '🥕', '🍯', '🍄', '🍊'];
function startCatch(){
  pet.queue = []; pet.cur = null; pet.target = null;
  mg = { kind:'catch', t0: performance.now(), score: 0, items: [], spawn: 0, px: W / 2, tx: W / 2, done: false, saved: { x: pet.x, y: pet.y }, clover: false };

function updateCatch(dt, now){
  const g = mg, e = (now - g.t0) / 1000;
  if (g.done){ if (now > g.doneAt) endMinigame(); return; }
  g.px += (g.tx - g.px) * min(1, dt * 12); pet.dir = g.tx >= pet.x ? 1 : -1; pet.x = g.px;
  g.spawn -= dt;
  if (g.spawn <= 0 && e < 19){
    g.spawn = rnd(.4, .65);
    const r = random(), bad = r < .17, clover = !bad && stageOf(G.form) === 'child' && !g.cloverSpawned && r < .22;
    if (clover) g.cloverSpawned = true;
    g.items.push({ x: rnd(24, W - 24), y: 30, v: rnd(90, 140) + e * 4, ch: bad ? '🪨' : clover ? '🍀' : pick(GOOD), bad, clover });
  }
  for (const it of g.items){
    it.y += it.v * dt;
    if (!it.hit && it.y > H - 100 && it.y < H - 56 && abs(it.x - g.px) < 38){
      it.hit = true;
      if (it.bad){ g.score = max(0, g.score - 2); pet.setAnim('surprised'); setTimeout(() => mg && !mg.done && pet.setAnim('mg_run'), 500); }
      else { g.score++; if (it.clover) g.clover = true; g.pop = { x: it.x, y: it.y, t: now, txt: it.clover ? '四葉草！' : '+1' }; }
    }
  }
  g.items = g.items.filter(it => !it.hit && it.y < H + 30);
  if (e >= 20){ g.done = true; g.win = g.score >= 10; g.doneAt = now + 2400; pet.setAnim(g.win ? 'excited' : 'happy'); pet.say(g.win ? `接到 ${g.score} 個！好厲害！` : `接到 ${g.score} 個～`, 2400); }
}
function drawCatch(now){

  ctx.fillStyle = '#9CCB6F'; ctx.fillRect(0, H - 8, W, 8);
  for (const it of g.items) emoji(it.ch, it.x, it.y, 28);

function startGuess(){

}

  const pickSide = x < W / 2 ? -1 : 1, ans = random() < .5 ? -1 : 1;

const toastEl = document.getElementById('toast');

function prep(opts = {}){
  lastInput = performance.now();

  if (stageOf(G.form) === 'egg'){ toast('還是一顆蛋，再等一下下～'); return false; }

  return true;

function recentFeeds(ms){ return G.feedLog.filter(f => G.t - f.t <= ms); }
function feed(food){
  if (!prep()) return;
  const st = stageOf(G.form), ch = charOf(G.form);
  if (food.cat !== 'T' && G.fake){ pet.run([{ anim:'refuse', dur:1800, say: line('refuse') }]); return; }
  const res = Gr.feedResult(food, { hunger: G.hunger, stage: st, char: ch,
    recentSame: recentFeeds(3 * HOUR).filter(f => f.id === food.id).length,
    hourCount: recentFeeds(HOUR).filter(f => f.counted).length });
  if (res.refused){
    G.mood = clamp(G.mood + res.mood);
    if (st === 'child') G.R.overfeed++;
    pet.run([{ anim:'refuse', dur:1800, say: line('full') }]); floatText('吃不下了', '#8A7560'); save(); renderUI(); return;
  }
  G.feedLog.push({ t: G.t, id: food.id, counted: !!res.counts && food.cat !== 'T', treat: food.cat === 'T' });
  G.feedLog = recentFeeds(3 * HOUR);
  // 效果立刻生效（以前要等動畫播完，連點時前一次會被取消）
  const before = { h: G.hunger, m: G.mood };
  G.hunger = clamp(G.hunger + res.hunger); G.mood = clamp(G.mood + res.mood);
  if (food.cat === 'T'){
    G.dayStats.treats++; if (st === 'child'){ G.R.treats++; G.R.foods[food.id] = (G.R.foods[food.id] || 0) + 1; }
  } else {
    G.dayStats.meals++; G.dayStats.cats[food.cat]++;
    if (Math.random() < Gr.POOP_CHANCE[st] && !G.poopDue) G.poopDue = G.t + (20 + floor(Gr.roll(G.petId, 'poop' + G.t) * 20)) * MIN;
    if (st === 'baby'){ for (const c in res.w) G.hidden[c] += res.w[c]; if (res.valid) G.babyMeals++; }
    if (st === 'child'){ const R = G.R; R.meals++; R.cats[food.cat]++; R.foods[food.id] = (R.foods[food.id] || 0) + 1; if (res.favorite) R.favMeals++; }
  }
  // 表演：拿著食物咬三口、碎屑、頭上飄 +♥、狀態列愛心跳一下、咀嚼音效
  pet.queue = []; pet.cur = null; pet.target = null;
  pet.run([{ anim:'eat', dur:2100, prop: food.icon, start: p => { p.propT = performance.now(); },
    say: food.cat === 'T' ? line('treat') : res.favorite ? line('fav') : line('fed'),
    end: p => { p.prop = null;
      if (food.cat === 'T' && recentFeeds(HOUR).filter(f => f.treat).length >= 3 && !G.sick){ getSick('treat'); save(); renderUI(); }
    } }]);
  const gainH = round((G.hunger - before.h) / 25 * 2) / 2, gainM = round((G.mood - before.m) / 25 * 2) / 2;
  if (gainH > 0) floatText(`飽足 +${gainH === .5 ? '½' : gainH}♥`, '#E0603A', 0);
  if (gainM > 0) floatText(`心情 +${gainM === .5 ? '½' : gainM}♥`, '#E07A92', gainH > 0 ? 350 : 0);
  if (res.favorite) floatText('最愛！', '#F2A13A', 700);
  chomp();
  save(); renderUI(true);
}
function doAction(type){

    case 'sleep': {

      const h = hourOf(G.t);
      if (h < T.bedOpenHour && h >= T.wakeHour){ toast('晚上 7 點以後才能去睡覺喔'); return; }
      if (G.sick){ toast('先用藥草把病治好吧'); return; }
      goSleep(true); break;
    }
    case 'playMenu':
      if (!prep()) return;
      if (G.sick){ pet.run([{ anim:'sick', dur:1800, say: line('noPlay') }]); return; }
      openPlay(); return;
    case 'medicine':
      if (!prep({ sleepOk: true })) return;
      if (!G.sick){ pet.say(line('notSick')); return; }
      G.medicineTries++;
      pet.run([{ anim:'medicine', dur:1600, say: line('medicine'), end: () => {
        if (G.medicineTries >= 2 || random() < .5){ G.sick = false; G.sickSince = null; pet.run([{ anim:'happy', dur:1600, say: line('cured') }]); }
        else pet.say('還有一點不舒服…', 2000);
        save(); renderUI();
      } }]); break;
    case 'clean': {
      if (!prep({ sleepOk: true })) return;
      if (!G.poops.length){ toast('沒有便便要清喔'); return; }
      if (stageOf(G.form) === 'child') G.R.poopsOnTime += G.poops.filter(p => G.t <= p.cleanBy).length;
      G.poops = []; G.dayStats.cleans++;
      if (!G.sleeping) pet.run([{ anim:'happy', dur:1400, say: line('cleaned') }]);
      break;
    }
    case 'scold':
      if (!prep()) return;
      if (G.fake){ G.fake = null; G.discipline = min(100, G.discipline + 25); pet.run([{ anim:'scolded', dur:2000, say: line('scolded') }]); toast('乖巧度提升了！'); }
      else pet.run([{ anim:'confused', dur:1800, say: line('notNeeded') }]);
      break;
    case 'statusMenu': openStatus(); return;
    case 'dexMenu': openDex(); return;
  }
  save(); renderUI();
}
function patPet(){
  if (!prep({ sleepOk: true })) return;
  if (G.sleeping){ pet.say(line('sleepTalk'), 1600); return; }
  const recent = (G.patLog || []).filter(t => G.t - t < 10 * MIN);
  const effective = recent.length < 3;
  G.patLog = [...recent, G.t];
  if (effective) G.mood = clamp(G.mood + 4);
  G.dayStats.pats++;
  if (stageOf(G.form) === 'child'){ G.R.pats++; const dk = dateKey(G.t); G.R.patDays[dk] = (G.R.patDays[dk] || 0) + 1; }
  pet.run([{ anim:'headpat', dur:1800, say: line('pat') }]);
  save(); renderUI();
}

/* ---------- 畫面點擊 ---------- */
function toLocal(ev){ const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', ev => {
  const { x, y } = toLocal(ev);
  lastInput = performance.now(); unlockAudio();
  if (mg){ if (mg.kind === 'catch') mg.tx = clamp(x, 26, W - 26); else guessTap(x); return; }
  const hit = abs(x - pet.x) < 60 && y > (pet._top ?? pet.y - 110) - 6 && y < pet.y + 8;
  if (hit) patPet();
});
cv.addEventListener('pointermove', ev => { if (mg && mg.kind === 'catch' && (ev.buttons || ev.pointerType !== 'mouse')) mg.tx = clamp(toLocal(ev).x, 26, W - 26); });
window.addEventListener('keydown', ev => {
  if (!mg) return;
  if (mg.kind === 'catch'){ if (ev.key === 'ArrowLeft'){ mg.tx = clamp(mg.tx - 44, 26, W - 26); ev.preventDefault(); } if (ev.key === 'ArrowRight'){ mg.tx = clamp(mg.tx + 44, 26, W - 26); ev.preventDefault(); } }
  else { if (ev.key === 'ArrowLeft') guessTap(0); if (ev.key === 'ArrowRight') guessTap(W); }
});

const heartStr = v => { const n = v <= 0 ? 0 : Math.ceil(v / 25 - 1e-9); return '♥'.repeat(n) + '♡'.repeat(4 - n); };

const ACTIONS = [

/* ---------- 底部選單 ---------- */

function ageDays(){ return G.hatchAt ? floor((G.t - G.hatchAt) / DAY) : 0; }
function openStatus(){

  let armed = false;

    <div class="statrow">

    </div>
    ${G.diary[0] ? `<div class="diary">📔 ${G.diary[0].text}</div>` : ''}
    ${adult ? `<p>長大了！可以讓${petName()}回到森林生活，留在圖鑑裡，再孵一顆新的蛋。</p><button class="plain" type="button" id="btnRetire">🌳 送回森林、孵新的蛋</button>` : ''}
    <button class="close" type="button" data-close>關閉</button>`, () => {

function openDex(){

    const ic = f === 'egg' ? '🌰' : f === 'baby' ? '🌱' : F.stage === 'child' ? { kuri:'🐰', sunny:'🦊', dodo:'🐻', piko:'🦔' }[f] : F.badge;
    return has ? `<div><span class="ic">${ic}</span><span>${F.name}</span></div>` : `<div><span class="ic no" style="filter:grayscale(1) opacity(.3)">${ic}</span><span class="no">???</span></div>`;

    <button class="close" type="button" data-close>關閉</button>`);

document.getElementById('btnSettings').addEventListener('click', openSettings);
let soundOn = true;
function openSettings(){
  let armed = false;
  openSheet(`<h2>設定</h2>
    <div class="seg"><button class="opt" type="button" id="btnSound" aria-pressed="${soundOn}">${soundOn ? '🔔 提示音：開' : '🔕 提示音：關'}</button></div>
    <h2>存檔</h2>
    <p>進度存在這台裝置的瀏覽器裡。可以匯出備份，換裝置時再匯入。</p>
    <div class="seg"><button class="opt" type="button" id="btnExport">匯出存檔</button><button class="opt" type="button" id="btnImport">匯入存檔</button></div>
    <textarea id="saveBox" hidden aria-label="存檔內容"></textarea>
    <details><summary>開發測試</summary>
      <p>時間流速（只影響開著遊戲時）。</p>
      <div class="seg">${[1, 10, 60, 600].map(v => `<button class="opt" type="button" data-speed="${v}" aria-pressed="${speed === v}">${v}×</button>`).join('')}</div>
      <div class="seg"><button class="opt" type="button" data-skip="60">＋1 小時</button><button class="opt" type="button" data-skip="1440">＋1 天</button><button class="opt" type="button" id="btnSync">對齊現實時間</button></div>
      <p id="dbg"></p>
    </details>
    <button class="danger" type="button" id="btnReset">重新開始（清除存檔與圖鑑）</button>
    <button class="close" type="button" data-close>完成</button>`, () => {
    const box = sheetBody.querySelector('#saveBox');
    sheetBody.querySelector('#btnSound').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = soundOn ? '🔔 提示音：開' : '🔕 提示音：關'; save(); });
    sheetBody.querySelector('#btnExport').addEventListener('click', () => { box.hidden = false; box.value = btoa(unescape(encodeURIComponent(JSON.stringify(serialize())))); box.select(); toast('已產生存檔碼，請複製保存'); });
    sheetBody.querySelector('#btnImport').addEventListener('click', () => {
      if (box.hidden){ box.hidden = false; box.value = ''; box.placeholder = '貼上存檔碼後再按一次「匯入存檔」'; box.focus(); return; }
      try { const d = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); if (!d.G) throw 0; applySave(d); save(); renderUI(); closeSheet(); toast('匯入完成'); } catch (e) { toast('存檔碼不正確'); }
    });
    sheetBody.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { speed = +b.dataset.speed; sheetBody.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); save(); clock(); }));
    sheetBody.querySelectorAll('[data-skip]').forEach(b => b.addEventListener('click', () => { for (let i = 0; i < +b.dataset.skip; i++) tickMinute(true); save(); renderUI(); clock(); dbg(); }));
    sheetBody.querySelector('#btnSync').addEventListener('click', () => { G.t = Date.now(); speed = 1; save(); clock(); toast('已對齊現實時間'); });
    const r = sheetBody.querySelector('#btnReset');
    r.addEventListener('click', () => { if (!armed){ armed = true; r.textContent = '再按一次確認清除'; return; } G = null; G = newGame(); speed = 1; resetPet(); save(); renderUI(); closeSheet(); toast('已重新開始'); });

function dbg(){
  const el = sheetBody.querySelector('#dbg'); if (!el) return;
  const st = stageOf(G.form), sh = Gr.shares(G.hidden).p;
  let s = `階段分鐘 ${G.stageMin}｜寶寶有效正餐 ${G.babyMeals}｜乖巧 ${G.discipline}`;
  if (st === 'baby') s += `｜傾向 G${(sh.G * 100) | 0} S${(sh.S * 100) | 0} H${(sh.H * 100) | 0} C${(sh.C * 100) | 0}`;
  if (st === 'child'){ const sc = Gr.styleScores(Gr.metrics(G.R, G.discipline)); s += `｜P${sc.P.toFixed(2)} R${sc.R.toFixed(2)} F${sc.F.toFixed(2)}｜失誤 ${G.R.mistakes}`; }
  el.textContent = s;

/* ---------- 提示音（輕柔，可關閉） ---------- */
let actx = null;
function unlockAudio(){ if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(freqs, dur = .12){
  if (!soundOn || !actx) return;
  freqs.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f; const t0 = actx.currentTime + i * dur; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.08, t0 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + dur); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02); });
}
const playCall = () => tone([880, 660]);
const chomp = () => { tone([392, 523], .09); setTimeout(() => tone([440, 587], .09), 600); setTimeout(() => tone([494, 659, 784], .1), 1200); };
const playChime = () => tone([523, 659, 784, 1047], .14);

/* =====================================================================
   存檔
   ===================================================================== */
function serialize(){ return { v: SAVE_VERSION, savedAt: Date.now(), speed, soundOn, G }; }
function migrate(g){
  // 之後存檔格式改版時在這裡升級舊存檔
  const base = newGame(g.collection || []);
  return Object.assign(base, g, { R: Object.assign(Gr.emptyRecords(), g.R || {}) });
}
function applySave(d, catchUp = true){
  if (!d || !d.G) return 0;
  G = migrate(d.G); speed = d.speed || 1; soundOn = d.soundOn !== false;
  resetPet();
  if (!catchUp) return 0;
  const now = Date.now(), away = now - (d.savedAt || now);
  if (away < 0){ G.decisions.push({ t: G.t, type: 'clock-back', ms: away }); return 0; }  // 時間倒退：不補算
  const mins = floor(away / MIN);
  const run = min(mins, T.offlineCapMin);
  for (let i = 0; i < run; i++) tickMinute(false);
  if (mins > run) G.t += (mins - run) * MIN;                                                 // 超過上限的時間直接跳過（數值和成長都停住）
  if (speed === 1 && abs(G.t - now) < 2 * MIN) G.t = now;
  // 離線期間的便便：回來後 30 分鐘內清掉都算準時，30 分鐘後才可能因此生病
  for (const p of G.poops) if (p.off){ p.born = max(p.born, G.t - 90 * MIN); p.cleanBy = G.t + 30 * MIN; p.off = false; }
  G.graceUntil = G.t + 30 * MIN;
  return mins;
}
function resetPet(){ pet.x = 240; pet.y = 266; pet.queue = []; pet.cur = null; pet.target = null; pet.speech = null; pet.setAnim(pet.rest()); mg = null; }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(serialize())); } catch (e) {} }

/* =====================================================================
   主迴圈
   ===================================================================== */
let last = performance.now(), uiT = 0, saveT = 0, acc = 0, calling = false;
function frame(now){
  const dt = min(.1, (now - last) / 1000); last = now;
  if (mg){ if (mg.kind === 'catch') updateCatch(dt, now); else updateGuess(dt, now); }
  else {
    acc += dt * 1000 * speed;
    let n = 0;
    while (acc >= MIN && n < 600){ acc -= MIN; tickMinute(true); n++; }
    pet.update(dt, now);
  }
  ctx.clearRect(0, 0, W, H);
  if (mg){ mg.kind === 'catch' ? drawCatch(now) : drawGuess(now); }
  else {
    drawForest(now); drawPoops(now); drawPet(pet, now); drawProp(pet, now); drawFx(pet, now); drawSpeech(pet, now); drawFloaters(now);
    if (G.sleeping){ ctx.fillStyle = `rgba(20,30,70,${BG.night && skyPhase(hourOf(G.t)) === 'night' ? .12 : .28})`; ctx.fillRect(0, 0, W, H); }
    if (needsCall()){ const k = 1 + sin(now / 160) * .08; ctx.save(); ctx.translate(W - 26, 26); ctx.scale(k, k); ell(0, 0, 16, 16); fs('rgba(255,255,255,.92)', '#E2A13A', 2); emoji('🔔', 0, 1, 17); ctx.restore(); }
    const fl = (now - flashAt) / 1000; if (fl < 1.2){ ctx.fillStyle = `rgba(255,255,240,${(1 - fl / 1.2) * .8})`; ctx.fillRect(0, 0, W, H); }
  }
  const c = needsCall(); if (c && !calling) playCall(); calling = c;
  uiT += dt; saveT += dt;
  if (uiT > .5){ uiT = 0; renderUI(); }
  if (saveT > 15){ saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function clock(){
  const d = new Date(G.t), h = d.getHours();
  const part = h < 6 ? '深夜' : h < 11 ? '早上' : h < 14 ? '中午' : h < 18 ? '下午' : h < 21 ? '傍晚' : '晚上';
  document.getElementById('clock').textContent = `${part} ${String(h).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}${speed !== 1 ? ` · 流速 ${speed}×` : ''}`;
}

function start(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { d = null; }
  if (d && d.G){
    const away = applySave(d, true);
    if (away > 30 && stageOf(G.form) !== 'egg' && !G.sleeping) setTimeout(() => pet.run([{ anim:'happy', dur:2400, say: line('miss') }]), 700);
  } else {
    G = newGame(); resetPet();
    setTimeout(() => toast('一顆橡實蛋來到森林裡了！'), 600);
  }
  newDayCheck();
  renderUI(); clock(); setInterval(clock, 5000);
  requestAnimationFrame(t => { last = t; frame(t); });
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
start();
